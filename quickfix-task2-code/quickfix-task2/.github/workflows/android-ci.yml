# ---------------------------------------------------------------------------
# QuickFix Laptop Solutions - Android CI
#
# Runs on every push and pull request. Proves the app compiles and the tests
# pass on a clean machine, not just on a team member's laptop.
#
#   1. Lint        - static analysis of the Android sources
#   2. Unit tests  - JVM tests (Validator, BookingRepository)
#   3. Build       - assembles a debug APK and publishes it as an artifact
# ---------------------------------------------------------------------------
name: Android CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create local.properties
        run: |
          echo "API_BASE_URL=${{ vars.API_BASE_URL || 'https://quickfix.co.za/api/v1/' }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Publish unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: mobile/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug

      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: mobile/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickfix-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    needs: build-and-test
    # The marked demonstration video must be recorded on a physical phone.
    # This job only guards against UI regressions between demos.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: mobile
          script: gradle --no-daemon connectedDebugAndroidTest
