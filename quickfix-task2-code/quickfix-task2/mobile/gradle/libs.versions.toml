# ---------------------------------------------------------------------------
# QuickFix Laptop Solutions - Gradle version catalogue
# Versions were current at the time of writing. If a dependency fails to
# resolve, update it here only - nothing else references a version number.
# ---------------------------------------------------------------------------
[versions]
agp                 = "8.13.0"
kotlin              = "2.1.0"
googleServices      = "4.4.2"

coreKtx             = "1.15.0"
lifecycle           = "2.8.7"
activityCompose     = "1.10.1"
navigationCompose   = "2.8.9"
compose             = "1.8.2"
material3           = "1.3.2"
datastore           = "1.1.1"
coroutines          = "1.9.0"

retrofit            = "2.11.0"
okhttp              = "4.12.0"

firebaseBom         = "34.17.0"
credentials         = "1.3.0"
googleid            = "1.1.1"

junit               = "4.13.2"
mockk               = "1.13.13"
androidxJunit       = "1.2.1"
espresso            = "3.6.1"

[libraries]
androidx-core-ktx            = { group = "androidx.core",            name = "core-ktx",                   version.ref = "coreKtx" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose",version.ref = "lifecycle" }
androidx-activity-compose    = { group = "androidx.activity",        name = "activity-compose",           version.ref = "activityCompose" }
androidx-navigation-compose  = { group = "androidx.navigation",      name = "navigation-compose",         version.ref = "navigationCompose" }
androidx-datastore-prefs     = { group = "androidx.datastore",       name = "datastore-preferences",      version.ref = "datastore" }

compose-ui                   = { group = "androidx.compose.ui",       name = "ui",                        version.ref = "compose" }
compose-ui-graphics          = { group = "androidx.compose.ui",       name = "ui-graphics",               version.ref = "compose" }
compose-ui-tooling           = { group = "androidx.compose.ui",       name = "ui-tooling",                version.ref = "compose" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",       name = "ui-tooling-preview",        version.ref = "compose" }
compose-ui-test-junit4       = { group = "androidx.compose.ui",       name = "ui-test-junit4",            version.ref = "compose" }
compose-ui-test-manifest     = { group = "androidx.compose.ui",       name = "ui-test-manifest",          version.ref = "compose" }
compose-material3            = { group = "androidx.compose.material3",name = "material3",                 version.ref = "material3" }
compose-icons-core           = { group = "androidx.compose.material",  name = "material-icons-core",       version.ref = "compose" }

kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",version.ref = "coroutines" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",   version.ref = "coroutines" }
kotlinx-coroutines-play       = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

retrofit                     = { group = "com.squareup.retrofit2",    name = "retrofit",                  version.ref = "retrofit" }
retrofit-gson                = { group = "com.squareup.retrofit2",    name = "converter-gson",            version.ref = "retrofit" }
okhttp-logging               = { group = "com.squareup.okhttp3",      name = "logging-interceptor",       version.ref = "okhttp" }
okhttp-mockwebserver         = { group = "com.squareup.okhttp3",      name = "mockwebserver",             version.ref = "okhttp" }

firebase-bom                 = { group = "com.google.firebase",       name = "firebase-bom",              version.ref = "firebaseBom" }
firebase-auth                = { group = "com.google.firebase",       name = "firebase-auth" }
firebase-firestore           = { group = "com.google.firebase",       name = "firebase-firestore" }

androidx-credentials         = { group = "androidx.credentials",      name = "credentials",               version.ref = "credentials" }
androidx-credentials-play    = { group = "androidx.credentials",      name = "credentials-play-services-auth", version.ref = "credentials" }
google-id                    = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

junit                        = { group = "junit",                     name = "junit",                     version.ref = "junit" }
mockk                        = { group = "io.mockk",                  name = "mockk",                     version.ref = "mockk" }
androidx-junit               = { group = "androidx.test.ext",         name = "junit",                     version.ref = "androidxJunit" }
espresso-core                = { group = "androidx.test.espresso",    name = "espresso-core",             version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services",   version.ref = "googleServices" }
